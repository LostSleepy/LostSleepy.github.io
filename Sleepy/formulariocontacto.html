<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto | Pedro Barrante</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ['"Shippori Mincho"', "serif"],
              body: ['"DM Sans"', "sans-serif"],
            },
            colors: {
              ink: {
                50: "#f0eee9",
                100: "#d4cfc6",
                200: "#a89f91",
                900: "#1a1714",
                950: "#0d0c0a",
              },
              accent: { DEFAULT: "#0ea5e9", light: "#7dd3fc", dark: "#0369a1" },
            },
          },
        },
      };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;600&family=Shippori+Mincho:wght@600;800&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "DM Sans", sans-serif;
        background-color: #0d0c0a;
      }
      .glass-input {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        transition: all 0.3s ease;
      }
      .glass-input:focus {
        background: rgba(255, 255, 255, 0.06);
        border-color: #0ea5e9;
        outline: none;
        box-shadow: 0 0 15px rgba(14, 165, 233, 0.1);
      }
    </style>
  </head>
  <body
    class="text-ink-100 min-h-screen flex items-center justify-center p-6 relative overflow-hidden"
  >
    <div
      class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-accent/5 blur-[120px] rounded-full"
    ></div>

    <main class="relative z-10 w-full max-w-lg">
      <header class="text-center mb-10">
        <a
          href="index.html"
          class="text-accent-light text-sm hover:underline mb-4 inline-block"
          >← Volver al inicio</a
        >
        <h1 class="text-4xl font-bold text-white font-display mb-2">
          ¿Hablamos?
        </h1>
        <p class="text-ink-200 text-sm italic">
          Hagamos realidad ese próximo proyecto.
        </p>
      </header>

      <form
        action="https://formspree.io/f/mnjwlzel"
        method="POST"
        class="space-y-6"
      >
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label
              for="name"
              class="text-xs font-bold uppercase tracking-widest text-ink-200 ml-1"
              >Nombre</label
            >
            <input
              type="text"
              name="name"
              id="name"
              required
              placeholder="Tu nombre"
              class="w-full px-5 py-4 rounded-2xl glass-input text-sm"
            />
          </div>
          <div class="space-y-2">
            <label
              for="email"
              class="text-xs font-bold uppercase tracking-widest text-ink-200 ml-1"
              >Email</label
            >
            <input
              type="email"
              name="email"
              id="email"
              required
              placeholder="tu@email.com"
              class="w-full px-5 py-4 rounded-2xl glass-input text-sm"
            />
          </div>
        </div>

        <div class="space-y-2">
          <label
            for="subject"
            class="text-xs font-bold uppercase tracking-widest text-ink-200 ml-1"
            >Asunto</label
          >
          <input
            type="text"
            name="subject"
            id="subject"
            placeholder="¿En qué puedo ayudarte?"
            class="w-full px-5 py-4 rounded-2xl glass-input text-sm"
          />
        </div>

        <div class="space-y-2">
          <label
            for="message"
            class="text-xs font-bold uppercase tracking-widest text-ink-200 ml-1"
            >Mensaje</label
          >
          <textarea
            name="message"
            id="message"
            rows="5"
            required
            placeholder="Escribe aquí tu mensaje..."
            class="w-full px-5 py-4 rounded-2xl glass-input text-sm resize-none"
          ></textarea>
        </div>

        <button
          type="submit"
          class="w-full py-5 bg-white text-ink-950 font-bold rounded-2xl hover:bg-accent hover:text-white transition-all shadow-xl active:scale-95 flex items-center justify-center gap-3 group"
        >
          Enviar Mensaje
          <svg
            class="w-4 h-4 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M14 5l7 7m0 0l-7 7m7-7H3"
            />
          </svg>
        </button>

        <input type="text" name="_gotcha" style="display: none" />
      </form>

      <footer class="mt-12 text-center">
        <p class="text-ink-200/20 text-[10px] uppercase tracking-[0.2em]">
          Pedro Barrante · Professional Inquiry · <span id="year"></span>
        </p>
      </footer>
    </main>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
