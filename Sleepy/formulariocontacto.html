<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Pedro Barrante</title>
    <link rel="shortcut icon" href="../multimediajujutsu/Iconos/favicon1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/CSSForm/Light.css">
</head>
<body class="form-page">

    <main class="form-container">
        <header class="form-header">
            <h1>¿Hablamos?</h1>
            <p>Rellena el formulario y estaré encantado de responderte.</p>
        </header>

        <form class="contact-form">
            <div class="input-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. María Fernández" required>
            </div>

            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="input-group">
                <label for="numero">Número de teléfono</label>
                <input type="tel" id="numero" name="numero" placeholder="Ej. 600 000 000">
            </div>

            <div class="input-group">
                <label for="mensaje">Mensaje (opcional)</label>
                <textarea id="mensaje" rows="4" placeholder="Cuéntame en qué puedo ayudarte..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Enviar Mensaje</button>
        </form>

        <footer class="form-footer">
            <a href="index.html" class="back-link">← Volver al inicio</a>
        </footer>
    </main>

</body>
</html>
