<!doctype html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Formulario de contacto profesional de Pedro Barrante." />
  <title>Contacto | Pedro Barrante</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Shippori Mincho"', 'serif'],
            body: ['"DM Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            jujutsu: {
              purple: { 300: '#a78bfa', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#1e1b4b', 950: '#0f0d2e' },
              dark: '#0a0a1a',
              card: 'rgba(255,255,255,0.05)',
              border: 'rgba(255,255,255,0.08)',
            },
          },
          animation: {
            'fade-up': 'fadeUp 0.7s ease both',
            'slide-up': 'slideUp 0.8s ease both',
            'float': 'float 6s ease-in-out infinite',
          },
          keyframes: {
            fadeUp: { '0%':{ opacity:'0', transform:'translateY(20px)' }, '100%':{ opacity:'1', transform:'translateY(0)' } },
            slideUp: { '0%':{ opacity:'0', transform:'translateY(40px) scale(0.95)' }, '100%':{ opacity:'1', transform:'translateY(0) scale(1)' } },
            float: { '0%,100%':{ transform:'translateY(0px)' }, '50%':{ transform:'translateY(-15px)' } },
          },
        },
      },
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Shippori+Mincho:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: #0a0a1a; color: #e2e8f0; min-height: 100vh; overflow-x: hidden; }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        linear-gradient(rgba(99,102,241,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 { width: 400px; height: 400px; background: rgba(99,102,241,0.12); top: -100px; right: -100px; animation: float 8s ease-in-out infinite; }
    .orb-2 { width: 300px; height: 300px; background: rgba(168,85,247,0.1); bottom: -50px; left: -50px; animation: float 10s ease-in-out infinite reverse; }

    .nav-glass {
      background: rgba(10,10,26,0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(99,102,241,0.15);
    }
    .nav-link {
      position: relative;
      transition: color 0.3s ease;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, #6366f1, #a78bfa);
      transition: width 0.3s ease;
    }
    .nav-link:hover::after { width: 100%; }
    .nav-link:hover { color: #a78bfa; }

    .glass-card {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 2rem;
    }
    .glass-input {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      color: white;
      transition: all 0.3s ease;
    }
    .glass-input:focus {
      background: rgba(255,255,255,0.06);
      border-color: #6366f1;
      outline: none;
      box-shadow: 0 0 20px rgba(99,102,241,0.15);
      transform: scale(1.01);
    }
    .glass-input::placeholder {
      color: rgba(255,255,255,0.2);
    }

    .gradient-text {
      background: linear-gradient(135deg, #c084fc, #818cf8, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0a1a; }
    ::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.3); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(99,102,241,0.5); }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <nav class="nav-glass fixed top-0 left-0 right-0 z-50 px-4 md:px-8">
    <div class="max-w-6xl mx-auto flex items-center justify-between h-16">
      <a href="index.html" class="flex items-center gap-2 group">
        <span class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-500 to-indigo-600 flex items-center justify-center text-white font-bold text-sm group-hover:scale-110 transition-transform">S</span>
        <span class="text-white font-display text-lg hidden sm:inline">Sleepy</span>
      </a>
      <div class="flex items-center gap-1 md:gap-4">
        <a href="index.html" class="nav-link text-sm text-gray-400 hover:text-purple-300 px-2 md:px-3 py-2 transition-colors">Perfil</a>
        <a href="biografia.html" class="nav-link text-sm text-gray-400 hover:text-purple-300 px-2 md:px-3 py-2 transition-colors">Biografía</a>
        <a href="gustos1.html" class="nav-link text-sm text-gray-400 hover:text-purple-300 px-2 md:px-3 py-2 transition-colors">Gustos</a>
        <a href="redessociales.html" class="nav-link text-sm text-gray-400 hover:text-purple-300 px-2 md:px-3 py-2 transition-colors">Redes</a>
        <a href="formulariocontacto.html" class="nav-link text-sm text-purple-300 px-2 md:px-3 py-2 border-b-2 border-purple-500">Contacto</a>
      </div>
    </div>
  </nav>

  <main class="relative z-10 min-h-screen flex items-center justify-center px-4 pt-20 pb-16">
    <div class="w-full max-w-lg animate-slide-up">
      <header class="text-center mb-10">
        <a href="index.html" class="text-purple-400 text-sm hover:text-white transition-colors mb-4 inline-block">← Volver al inicio</a>
        <div class="inline-flex items-center gap-2 glass-card px-4 py-2 rounded-full text-xs text-purple-300 mb-4" style="display:inline-flex; background:rgba(255,255,255,0.03); border-color:rgba(99,102,241,0.2)">
          <span class="w-2 h-2 bg-purple-500 rounded-full animate-pulse"></span>
          Contacto
        </div>
        <h1 class="text-4xl font-bold text-white font-display mb-2 gradient-text">¿Hablamos?</h1>
        <p class="text-gray-400 text-sm italic">Hagamos realidad ese próximo proyecto.</p>
      </header>

      <div class="glass-card p-8 shadow-2xl">
        <form action="https://formspree.io/f/mnjwlzel" method="POST" class="space-y-6">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div class="space-y-2">
              <label for="name" class="text-xs font-bold uppercase tracking-widest text-gray-400 ml-1">Nombre</label>
              <input type="text" name="name" id="name" required placeholder="Tu nombre" class="w-full px-5 py-4 rounded-2xl glass-input text-sm" />
            </div>
            <div class="space-y-2">
              <label for="email" class="text-xs font-bold uppercase tracking-widest text-gray-400 ml-1">Email</label>
              <input type="email" name="email" id="email" required placeholder="tu@email.com" class="w-full px-5 py-4 rounded-2xl glass-input text-sm" />
            </div>
          </div>

          <div class="space-y-2">
            <label for="subject" class="text-xs font-bold uppercase tracking-widest text-gray-400 ml-1">Asunto</label>
            <input type="text" name="subject" id="subject" placeholder="¿En qué puedo ayudarte?" class="w-full px-5 py-4 rounded-2xl glass-input text-sm" />
          </div>

          <div class="space-y-2">
            <label for="message" class="text-xs font-bold uppercase tracking-widest text-gray-400 ml-1">Mensaje</label>
            <textarea name="message" id="message" rows="5" required placeholder="Escribe aquí tu mensaje..." class="w-full px-5 py-4 rounded-2xl glass-input text-sm resize-none"></textarea>
          </div>

          <button type="submit" class="w-full py-5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold rounded-2xl hover:from-purple-500 hover:to-indigo-500 transition-all shadow-xl active:scale-95 flex items-center justify-center gap-3 group">
            Enviar Mensaje
            <svg class="w-4 h-4 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </button>

          <input type="text" name="_gotcha" style="display:none" />
        </form>
      </div>

      <footer class="mt-12 text-center">
        <p class="text-gray-600 text-[10px] uppercase tracking-[0.2em]">Pedro Barrante · Professional Inquiry · <span id="year"></span></p>
      </footer>
    </div>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
